<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b86a07">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <meta name="referrer" content="no-referrer">
  <title>Abastecimento</title>
  <link rel="icon" href="__RAIZ__comum/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__RAIZ__comum/base.css">
  <link rel="stylesheet" href="__RAIZ__comum/pecas.css">
  <link rel="stylesheet" href="__RAIZ__app/app.css">
  <script type="module" src="__RAIZ__app/app.js"></script>
</head>
<body>
  <!-- Abertura: aparece no mesmo instante em que o app abre e sai quando a primeira tela fica pronta -->
  <div class="abertura-app" id="abertura" role="status" aria-label="Abrindo o app">
    <svg width="64" height="64" viewBox="0 0 30 30" aria-hidden="true"><rect width="64" height="64" rx="7" fill="#b86a07"/>
        <rect x="8" y="6.5" width="10.5" height="17" rx="1.6" fill="#fff"/><rect x="9.8" y="8.6" width="6.9" height="4.4" rx=".8" fill="#b86a07"/>
        <path d="M18.5 17.5h3.4V10" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="6.6" y="22.6" width="13.4" height="1.9" rx=".9" fill="#fff"/></svg>
    <b>Abastecimento</b>
    <span class="progresso" aria-hidden="true"><i></i></span>
    <small id="abertura-msg">Carregando…</small>
  </div>
  <div class="tela">
    <header class="topo">
      <button class="ico" id="menu" type="button" aria-label="Abrir menu" aria-controls="gaveta" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#b86a07"/>
        <rect x="8" y="6.5" width="10.5" height="17" rx="1.6" fill="#fff"/><rect x="9.8" y="8.6" width="6.9" height="4.4" rx=".8" fill="#b86a07"/>
        <path d="M18.5 17.5h3.4V10" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="6.6" y="22.6" width="13.4" height="1.9" rx=".9" fill="#fff"/></svg>
      <div class="titulo"><b id="titulo-tela">Abastecimento</b><span id="subtitulo"></span></div>
    </header>
    <main class="conteudo" id="conteudo"></main>
  </div>
  <div class="veu" id="veu" hidden></div>
  <nav class="gaveta" id="gaveta" aria-label="Menu" hidden>
    <div class="gaveta-topo">
      <div class="marca-app"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#b86a07"/>
        <rect x="8" y="6.5" width="10.5" height="17" rx="1.6" fill="#fff"/><rect x="9.8" y="8.6" width="6.9" height="4.4" rx=".8" fill="#b86a07"/>
        <path d="M18.5 17.5h3.4V10" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="6.6" y="22.6" width="13.4" height="1.9" rx=".9" fill="#fff"/></svg><div><b>Abastecimento</b><span>Posto interno</span></div></div>
      <div class="quem" id="gaveta-quem"></div>
    </div>
    <div class="itens" id="abas">
      <button type="button" class="item" data-aba="abastecer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4h6A1.5 1.5 0 0 1 14 5.5V20M4 20h11M7 8h5M14 9h2l2 2v6a1 1 0 0 0 2 0V8l-2.5-2.5"/></svg>Abastecer</button>
      <button type="button" class="item" data-aba="turno"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.1M4.5 12h.1M4.5 17h.1"/></svg>Turno de hoje<em data-qtd="turno"></em></button>
      <button type="button" class="item" data-aba="chegada"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16V6h11v10M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Chegada de diesel</button>
      <button type="button" class="item" data-aba="aferir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l-1.5 16h-9zM6.6 9h10.8M10 14h4"/></svg>Aferição<em data-qtd="aferir"></em></button>
      <button type="button" class="item" data-aba="fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="1.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>Abrir e fechar turno<em data-qtd="fechar"></em></button>
      <span class="sec">Ajuda</span>
      <button type="button" class="item" data-aba="ajuda"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1.1.9-1.1 1.7M12 16.5v.1"/></svg>Guia de uso</button>
    </div>
    <div class="gaveta-fim">
      <button type="button" class="item" id="sair" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h4.5v14H14M4 12h10M7.5 8.5 4 12l3.5 3.5"/></svg>Trocar frentista</button>
    </div>
  </nav>
</body>
</html>
